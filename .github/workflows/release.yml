name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from the history between tags, which a shallow clone
          # does not have.
          fetch-depth: 0

      # The plugin manifest names the release that `herdr plugin install` downloads. A tag that
      # disagrees with it would publish a release the plugin's own build step then refuses.
      - name: Check the plugin manifest against the tag
        run: |
          manifest=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' herdr-plugin.toml | head -n 1)
          if [ "v${manifest}" != "${GITHUB_REF_NAME}" ]; then
            echo "herdr-plugin.toml says ${manifest}, but the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A tag is published the moment this job succeeds, and a release cannot be taken back once
      # someone has downloaded it. The tests run first for that reason.
      - run: go test ./...

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
